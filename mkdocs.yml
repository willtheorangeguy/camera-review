INHERIT: .mkdocs-shared/shared/mkdocs.base.yml

site_name: CamReview
site_description: A private, local CLI for finding and reviewing motion in existing security-camera recordings.
site_author: willtheorangeguy
site_url: https://williamvdg.me/camera-review/

repo_url: https://github.com/willtheorangeguy/camera-review
repo_name: willtheorangeguy/camera-review
edit_uri: edit/main/docs/

copyright: Copyright &copy; willtheorangeguy

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Installation: installation.md
      - Usage: usage.md
      - Configuration: configuration.md
      - Nightly automation: deployment.md
      - Troubleshooting: troubleshooting.md
  - Reference:
      - Command reference: api.md
      - Report schema: schema.md
      - FAQ: faq.md
  - Development:
      - Architecture: architecture.md
      - Development guide: development.md
      - Testing: testing.md
      - CI/CD: ci-cd.md
      - Roadmap and limitations: roadmap.md
  - About:
      - License: license.md
      - Contributing: https://github.com/willtheorangeguy/.github/blob/main/CONTRIBUTING.md
      - Code of Conduct: https://github.com/willtheorangeguy/.github/blob/main/CODE_OF_CONDUCT.md
      - Security: https://github.com/willtheorangeguy/.github/blob/main/SECURITY.md

exclude_docs: |
  docs.instructions.md
  internal/known-issues.md
