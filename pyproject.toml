[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "camreview"
version = "1.0.1"
description = "Local, retrospective motion analysis for security-camera recordings"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "CamReview contributors"}]
keywords = ["camera", "motion-detection", "security-camera", "video"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "av>=16",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
]

[project.urls]
Documentation = "https://williamvdg.me/camera-review/"
Issues = "https://github.com/willtheorangeguy/camera-review/issues"
Repository = "https://github.com/willtheorangeguy/camera-review"

[project.optional-dependencies]
detect = ["ultralytics>=8.3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.14"]

[project.scripts]
camreview = "camreview.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["camreview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: tests that invoke video codecs or optional models"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
check_untyped_defs = true
